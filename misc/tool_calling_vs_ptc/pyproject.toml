[project]
name = "tool-calling-vs-ptc"
version = "0.1.0"
description = "Tool calling vs programmatic tool calling (PTC) on a PARCS cluster, swept over the layer-plan size"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "eval-utils[vertexai,google,anthropic]",
    "parcs-agent",
    "langchain>=1.2.15",
    "langchain-mcp-adapters>=0.3.2",
    "langsmith>=0.7.32",
    "mcp>=1.30.0",
    "python-dotenv>=1.2.2",
]

[project.scripts]
tcvp = "tool_calling_vs_ptc.cli:main"
tcvp-metrics = "tool_calling_vs_ptc.analysis.cli:main"

[tool.uv.sources]
eval-utils = { path = "../eval_utils", editable = true }
parcs-agent = { path = "../parcs_agent", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mpmath>=1.3.0",
    "numpy>=2.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.17.2",
    "uvicorn>=0.30",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"scripts/dry_run.py" = ["E501"]  # embedded C# source

[tool.ruff.format]
quote-style = "double"
