[project]
name = "eval-utils"
version = "0.1.0"
description = "Settings, model factory and middleware shared by the PARCS evaluation harnesses"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.2.15",
    "langchain-openai>=1.2.1",
    "pydantic>=2.13.2",
    "pydantic-settings>=2.13.1",
]

[project.optional-dependencies]
vertexai = ["langchain-google-vertexai>=2.0.0"]
google = ["langchain-google-genai>=4.2.2"]
anthropic = ["langchain-anthropic>=1.4.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
